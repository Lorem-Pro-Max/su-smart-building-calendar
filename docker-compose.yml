volumes:
  booking_frontend_dist:

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  booking-calendar-frontend:
    build:
      context: ./client
      args:
        - VITE_API_BASE=${VITE_API_BASE}
    container_name: booking-calendar-frontend
    volumes:
      - booking_frontend_dist:/shared-assets
    command: sh -c "cp -rv /app/dist/. /shared-assets/"

  booking-calendar-backend:
    build: ./server
    container_name: booking-calendar-backend
    restart: always
    ports:
      - "8112:8112"
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - IOT_SERVER_URL=${IOT_SERVER_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "55.sc.su.ac.th:host-gateway"

  booking-calendar-nginx:
    image: nginx:stable-alpine
    container_name: booking-calendar-nginx
    ports:
      - "7190:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - booking_frontend_dist:/usr/share/nginx/html/booking-calendar:ro
    depends_on:
      - booking-calendar-backend
    restart: always
